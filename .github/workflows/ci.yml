
name: VitalTrack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate VitalTrack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check server.api.js

      - name: Build React frontend
        run: npm run build:client

      - name: Run tests if configured
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:ci'] ? 0 : 1)" \
          && npm run test:ci \
          || echo "Review test:ci configuration"
